      - generic [ref=f25e273]:
        - banner [ref=f25e274]:
          - paragraph [ref=f25e275]: Añadido Rápido Mágico
        - generic [ref=f25e277]:
          - paragraph [ref=f25e278]: Al crear una tarea, puede utilizar palabras clave especiales para añadir directamente atributos a la tarea recién creada. Esto permite agregar atributos comúnmente usados en tareas mucho más rápido.
          - heading "Etiquetas" [level=3] [ref=f25e279]
          - paragraph [ref=f25e280]: Para añadir una etiqueta, simplemente prefija el nombre de la etiqueta con *. Vikunja comprobará primero si la etiqueta ya existe y la creará en caso contrario. Puedes usar esto varias veces.
          - paragraph [ref=f25e281]: "Para utilizar espacios, simplemente añada un \" o ' alrededor del nombre de la etiqueta. Por ejemplo: *\"Etiqueta con espacios\"."
          - heading "Prioridad" [level=3] [ref=f25e282]
          - paragraph [ref=f25e283]: Para establecer la prioridad de una tarea, agregue un número 1-5, prefijado por !. Cuanto mayor sea el número, mayor será la prioridad.
          - heading "Responsables" [level=3] [ref=f25e284]
          - paragraph [ref=f25e285]: Para asignar directamente la tarea a un usuario, agregue su nombre de usuario con el prefijo @ a la tarea. Puedes usar esto varias veces.
          - heading "Proyectos" [level=3] [ref=f25e286]
          - paragraph [ref=f25e287]: Para establecer un proyecto para que la tarea aparezca en ella, introduzca su nombre con el prefijo +. Esto devolverá un error si el proyecto no existe.
          - paragraph [ref=f25e288]: "Para usar espacios, simplemente añada un \" o ' alrededor del nombre del proyecto. Por ejemplo: +\"Proyecto con espacios\"."
          - heading "Fecha y hora" [level=3] [ref=f25e289]
          - paragraph [ref=f25e290]: "Cualquier fecha se utilizará como fecha de vencimiento de la tarea nueva. Puede utilizar fechas en cualquiera de estos formatos:"
          - list [ref=f25e291]:
            - listitem [ref=f25e292]: Today
            - listitem [ref=f25e293]: Tonight
            - listitem [ref=f25e294]: Tomorrow
            - listitem [ref=f25e295]: Next monday
            - listitem [ref=f25e296]: This weekend
            - listitem [ref=f25e297]: Later this week
            - listitem [ref=f25e298]: Later next week
            - listitem [ref=f25e299]: Next week
            - listitem [ref=f25e300]: Next month
            - listitem [ref=f25e301]: End of month
            - listitem [ref=f25e302]: In 5 days [hours/weeks/months]
            - listitem [ref=f25e303]: Tuesday (any weekday, will use the next date with that day)
            - listitem [ref=f25e304]: 02/17/2021
            - listitem [ref=f25e305]: 2021-02-17
            - listitem [ref=f25e306]: 17.02.2021
            - listitem [ref=f25e307]: Feb 17 (se usará el año actual)
            - listitem [ref=f25e308]: 17th (se usará el 17º del mes actual)
          - paragraph [ref=f25e309]: Combina cualquiera de los formatos de fecha con "at 17:00" (o 5pm) para establecer la hora.
          - heading "Tareas repetitivas" [level=3] [ref=f25e310]
          - paragraph [ref=f25e311]: "Para establecer una tarea repetitiva en un intervalo, simplemente añade 'every {amount} {type}' al texto de la tarea. La cantidad debe ser un número y puede ser omitido para utilizar solo el tipo (ver ejemplos)."
          - paragraph [ref=f25e312]: "Por ejemplo:"
          - list [ref=f25e313]:
            - listitem [ref=f25e314]: Every day
            - listitem [ref=f25e315]: Every 3 days
            - listitem [ref=f25e316]: Every week
            - listitem [ref=f25e317]: Every 2 weeks
            - listitem [ref=f25e318]: Every month
